<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Türchen</title>
<link href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@700&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<style>
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; text-align: center;
    font-family: Nunito, system-ui, sans-serif; color: #3a1a12;
    background: #fbf5ea radial-gradient(circle at 50% 30%, #fff, #f6ead3);
    padding: 24px; box-sizing: border-box;
  }
  .nr {
    font: 700 clamp(5rem, 20vw, 9rem)/1 "Mountains of Christmas", Georgia, serif; color: #b3262d;
  }
  h1 { font-family: "Mountains of Christmas", Georgia, serif; font-size: 2rem; margin: .2em 0; }
  p { max-width: 32em; margin: .5em auto; opacity: .8; }
  .stern { font-size: 2.5rem; }
</style>
</head>
<body>
  <main>
    <div class="stern">⭐</div>
    <div class="nr" id="nr">?</div>
    <h1>Türchen geöffnet!</h1>
    <p>Dies ist eine Platzhalter-Seite. Hier erscheint später der Inhalt für dieses Türchen.</p>
  </main>
<script>
  const nr = new URLSearchParams(location.search).get("nr");
  if (nr) { document.getElementById("nr").textContent = nr; document.title = "Türchen " + nr; }
</script>
</body>
</html>
